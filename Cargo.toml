[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devvspaces/git-shield"
authors = ["Ayanwola Ayomide"]

[workspace.dependencies]
shield-core = { path = "crates/shield-core", package = "git-shield-core", version = "=0.5.0" }
shield-git = { path = "crates/shield-git", package = "git-shield-git", version = "=0.5.0" }
shield-rules = { path = "crates/shield-rules", package = "git-shield-rules", version = "=0.5.0" }
shield-report = { path = "crates/shield-report", package = "git-shield-report", version = "=0.5.0" }
shield-github = { path = "crates/shield-github", package = "git-shield-github", version = "=0.5.0" }

anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.90.0", default-features = false, features = ["revision", "sha1", "max-performance", "parallel"] }
rayon = "1.12.0"
aho-corasick = "1.1.5"
regex = "1.13.1"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
infer = "0.22.0"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
dialoguer = "0.12.0"
sha2 = "0.11.1"
hex = "0.4.3"
yaml-rust2 = "0.13.0"
imara-diff = "0.2.0"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
# Only the light modules: no PE/ELF/Mach-O parsers (and their crypto stack).
yara-x = { version = "=1.23.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "hash-module", "math-module", "string-module", "time-module"] }

# dev
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["json", "filters"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
