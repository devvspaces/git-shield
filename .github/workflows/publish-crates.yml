# Publishes the six crates to crates.io, called by release.yml after the
# GitHub Release exists (ADR 0011). Runs in the `release` environment, which
# needs the maintainer's approval and holds CARGO_REGISTRY_TOKEN.
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable, 2026-10-16
        with:
          toolchain: stable
      # Dependency order. A version already on crates.io is skipped, so a
      # failed run can be re-run.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          for crate in git-shield-core git-shield-git git-shield-github git-shield-report git-shield-rules git-shield; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'git-shield-release (github.com/devvspaces/git-shield)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$code" = "200" ]; then
              echo "$crate $version is already published"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
