# git-shield checks its own pushes and pull requests with the action in this
# repository (`uses: ./`).
name: git-shield
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          build-from-source: "true"   # always test this commit
