# Known indicators from public incident write-ups. Every entry names its
# source. Add only what a published analysis (or a first-hand incident)
# confirms; generic names that legitimate projects also use do not belong here
# (disguised fonts, for example, are caught by content checks instead).
#
# severity: "low" | "medium" | "high" | "critical" (default "high").

# Labels used by malicious VS Code tasks. Adds context to T1 findings.
